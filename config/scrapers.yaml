# Scraper Configuration

scrapers:
  betfair:
    enabled: true
    interval_seconds: 30
    mode: scraper  # Change to 'api' when API key is available
    api_config:
      app_key: ""
      username: ""
      password: ""

  paddy_power:
    enabled: true
    interval_seconds: 45

  bet365:
    enabled: true
    interval_seconds: 60

  skybet:
    enabled: false
    interval_seconds: 45

  betvictor:
    enabled: false
    interval_seconds: 45

# Anti-detection settings
anti_detection:
  random_delay_min: 1
  random_delay_max: 3
  user_agent_rotation: true

# Rate limiting
rate_limiting:
  max_requests_per_minute: 60
  backoff_factor: 2
  max_retries: 3
